name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # L'immagine ubuntu-latest ha già l'SDK Android: aggiungo solo la piattaforma 36 usata da Capacitor 8
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      # Firma facoltativa: se i secret ANDROID_KEYSTORE_* sono impostati si genera anche l'APK firmato
      - name: Keystore
        if: ${{ env.KS != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/veicoli.jks
          cat > android/keystore.properties <<PROPS
          storeFile=veicoli.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          if [ -f keystore.properties ]; then ./gradlew assembleRelease; fi
      - uses: actions/upload-artifact@v4
        with:
          name: veicoli-apk
          path: android/app/build/outputs/apk/**/*.apk
      # Pubblica l'APK di prova sempre allo stesso link:
      # https://github.com/lazzariandreala-boop/veicoli/releases/latest/download/veicoli.apk
      - name: Pubblica l'APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk veicoli.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima veicoli.apk --latest --title "Veicoli – ultima versione" \
            --notes "APK compilato da ${GITHUB_SHA::7} il $(date -u '+%d/%m/%Y %H:%M') UTC. Scaricalo dal telefono e installalo sopra quello vecchio."
